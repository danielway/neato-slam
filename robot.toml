# Geometry and sensor parameters for the robot, read by the station, the
# simulator and SLAM. Every recorded log embeds a copy.
# Values marked TODO are placeholders until measured on the real Neato.
# Robot origin: midway between the two drive wheels.
# Robot frame: x forward, y left, angles counterclockwise in radians.

[drive]
wheel_base_m = 0.2445        # measured 9 5/8" tread centre to tread centre
max_wheel_speed_mm_s = 300.0 # TODO: confirm against the model's SetMotor limit

[lidar]
x_m = -0.0984     # measured 3 7/8" behind the wheel axle midpoint
y_m = 0.0
theta_rad = 0.0   # checked: angle 0 points forward and angles run counterclockwise
beams = 360
min_range_m = 0.06
max_range_m = 5.0
scan_hz = 5.0

[marker]
# AprilTag 36h11 on the robot's top, for the ceiling camera (camera.toml,
# tools/camera-tracker.py). Printed with an arrow along the tag's top edge;
# theta_rad is that arrow's angle from robot forward.
id = 0
size_m = 0.100    # TODO: the black square's side, 0.100 or 0.075 as mounted
height_m = 0.10   # TODO: measure, floor to the tag's face
x_m = 0.0         # TODO: measure, the tag's centre in the robot frame
y_m = 0.0
theta_rad = 0.0
