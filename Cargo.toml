[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
robot-msgs = { path = "crates/robot-msgs" }
neato-proto = { path = "crates/neato-proto" }
robot-io = { path = "crates/robot-io" }
sim = { path = "crates/sim" }
slam = { path = "crates/slam" }
eval = { path = "crates/eval" }
recorder = { path = "crates/recorder" }

anyhow = "1"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
toml = "1"
